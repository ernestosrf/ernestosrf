name: Update GitHub Stats

on:
  schedule:
    # Executa todos os dias às 03:00 UTC
    # = 00:00 no horário de Brasília normalmente
    - cron: "0 3 * * *"

  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=ernestosrf
            &hide_title=false
            &hide_rank=false
            &show_icons=true
            &include_all_commits=true
            &count_private=true
            &disable_animations=false
            &theme=dark
            &locale=en
            &hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=ernestosrf
            &locale=en
            &hide_title=false
            &layout=compact
            &langs_count=5
            &theme=dark
            &hide_border=false
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi
